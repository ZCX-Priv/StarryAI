<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>星语</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/utilities.css">

  <!-- highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<!-- ── Mobile Sidebar Overlay ────────────────────────── -->
<div id="sb-overlay" onclick="closeSidebar()"></div>

<!-- ── App Shell ─────────────────────────────────────── -->
<div id="app">
  <canvas id="chat-honeycomb"></canvas>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">
        <div class="sb-logo-mark"><img src="logo.png" alt="Logo"></div>
        <span class="sb-logo-name">星语</span>
      </div>
      <button class="btn-new" onclick="Chat.create()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span id="txt-new-chat">新对话</span>
      </button>
    </div>
    <div class="sb-section" id="txt-chats-label">对话</div>
    <div class="chat-list" id="chat-list"></div>
    <div class="sb-bottom">

      <button class="sb-btn" onclick="UI.openModal('settings')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span id="txt-settings">设置</span>
      </button>

    </div>
  </aside>

  <!-- Main content -->
  <main id="main">
    <!-- Topbar -->
    <div id="topbar">
      <div class="tb-left">
        <button class="tb-toggle" onclick="toggleSidebar()" id="sb-toggle-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="tb-title" id="chat-title">新对话</span>
      </div>
      <div class="tb-right">
        <button class="brain-btn" id="brain-btn" onclick="UI.openModal('memory')">
          <div class="mem-dot"></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>
        </button>
        <button class="model-pill" id="model-pill-btn" onclick="UI.openModal('model')" title="">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h6M3 15h6"/></svg>
          <span id="model-pill-label">deepseek</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="icon-btn" onclick="Theme.toggle()" id="theme-btn">
          <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>

    <!-- Chat Area -->
    <div id="chat-area">
      <div class="messages-inner" id="messages"></div>
    </div>

    <!-- Input Area -->
    <div id="input-area">
      <button id="scroll-btn" onclick="UI.scrollToBottom(true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        <span id="txt-scroll-down">滚动到底部</span>
      </button>
      <div id="stream-status">
        <div class="stream-dot"></div>
        <span id="stream-status-text">正在生成回复…</span>
      </div>
      <div class="input-container">
        <div class="input-wrapper">
          <textarea id="msg-input" rows="1" placeholder="发消息..." onkeydown="UI.handleInputKey(event)" oninput="UI.autoResize(this)"></textarea>
        </div>
        <div class="input-actions">
          <button class="action-btn" title="附件" id="attachBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M21.44 11.05L12.25 20.24C10.73 21.76 8.27 21.76 6.75 20.24C5.23 18.72 5.23 16.26 6.75 14.74L15.94 5.55C16.92 4.57 18.51 4.57 19.49 5.55C20.47 6.53 20.47 8.12 19.49 9.1L10.3 18.29C9.81 18.78 9.02 18.78 8.53 18.29C8.04 17.8 8.04 17.01 8.53 16.52L17.72 7.33" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="divider"></div>
          <div class="dropdown-wrapper quick-dropdown-wrapper">
            <button class="action-btn quick-btn" title="快速" id="quickBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" data-icon="quick">
                <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>快速</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="dropdown-menu quick-menu" id="quickMenu">
              <div class="dropdown-item active" data-mode="quick" data-icon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>快速</span>
                </div>
                <p class="dropdown-item-desc">适用于大部分情况</p>
                <div class="dropdown-check">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M5 12L10 17L19 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
              <div class="dropdown-item" data-mode="think" data-icon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>思考</span>
                </div>
                <p class="dropdown-item-desc">擅长解决更难的问题</p>
              </div>
              <div class="dropdown-item" data-mode="expert" data-icon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 2V6M12 18V22M2 12H6M18 12H22M5.64 5.64L8.46 8.46M15.54 15.54L18.36 18.36M5.64 18.36L8.46 15.54M15.54 8.46L18.36 5.64" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'>
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M12 2V6M12 18V22M2 12H6M18 12H22M5.64 5.64L8.46 8.46M15.54 15.54L18.36 18.36M5.64 18.36L8.46 15.54M15.54 8.46L18.36 5.64" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  <span>专家</span>
                </div>
                <p class="dropdown-item-desc">研究级智能模型</p>
              </div>
            </div>
          </div>
          <button class="action-btn" title="图像生成" id="imageBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
              <path d="M21 15L16 10L5 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>图像生成</span>
          </button>
          <button class="action-btn" title="帮我写作" id="writeBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 6H16M8 10H16M8 14H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>帮我写作</span>
          </button>
          <div class="dropdown-wrapper more-dropdown-wrapper">
            <button class="action-btn" title="更多" id="moreBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
                <rect x="15" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
                <rect x="3" y="15" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
                <rect x="15" y="15" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <span>更多</span>
            </button>
            <div class="dropdown-menu more-menu" id="moreMenu">
              <div class="dropdown-item" data-action="translate">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M4 6H12M4 6L2 10M4 6L8 10M12 6L10 10M12 6L14 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 10H14M8 10V20M14 20L18 14M14 20L10 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>翻译</span>
                </div>
              </div>
              <div class="dropdown-item" data-action="coding">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M8 6L3 12L8 18M16 6L21 12L16 18M14 4L10 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>编程</span>
                </div>
              </div>
              <div class="dropdown-item" data-action="research">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M10 10C10 11.1 9.1 12 8 12C6.9 12 6 11.1 6 10C6 8.9 6.9 8 8 8C9.1 8 10 8.9 10 10Z" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M18 10C18 11.1 17.1 12 16 12C14.9 12 14 11.1 14 10C14 8.9 14.9 8 16 8C17.1 8 18 8.9 18 10Z" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M10 14C10 14 11 17 14 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M2 10C2 6 5.58 3 10 3C14.42 3 18 6 18 10C18 14 14.42 17 10 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M12 17V21M8 21H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  <span>深入研究</span>
                </div>
              </div>
              <div class="dropdown-item" data-action="podcast">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M16 8C16 8 18 10 18 12C18 14 16 16 16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  <span>AI 播客</span>
                </div>
              </div>
              <div class="dropdown-item" data-action="meeting">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="1" fill="currentColor"/>
                  </svg>
                  <span>记录会议</span>
                </div>
              </div>
              <div class="dropdown-item" data-action="music">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M9 18V5L21 3V16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.5"/>
                  </svg>
                  <span>音乐生成</span>
                </div>
              </div>
              <div class="dropdown-item" data-action="solve">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M9 10C9 10 9.5 8 12 8C14.5 8 15 10 15 10C15 10 14.5 12 12 12C9.5 12 9 14 9 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  <span>解题答疑</span>
                </div>
              </div>
              <div class="dropdown-item" data-action="analysis">
                <div class="dropdown-item-header">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M12 7V12L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>数据分析</span>
                </div>
              </div>
            </div>
          </div>
          <div class="spacer"></div>
          <button class="send-btn" id="send-btn" title="发送" onclick="Chat.send()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 19V5M5 12L12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="stop-btn" id="stop-btn" onclick="Chat.stopGeneration()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
      <div class="input-hint" id="txt-input-hint">回复可能包含错误</div>
    </div>
  </main>
</div>

<!-- ── Modals ─────────────────────────────────────────── -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title" id="txt-settings-title">设置</span>
      <button class="icon-btn" onclick="UI.closeModal('settings-modal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tab-keys" onclick="Modals.switchTab('keys')"><span id="txt-tab-keys">密钥</span></button>
      <button class="modal-tab" id="tab-appearance" onclick="Modals.switchTab('appearance')"><span id="txt-tab-appearance">外观</span></button>
    </div>
    <div class="modal-body" id="settings-body"></div>
  </div>
</div>

<div class="modal-overlay" id="memory-modal">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title" id="txt-memory-title">记忆</span>
      <button class="icon-btn" onclick="UI.closeModal('memory-modal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="memory-body"></div>
    <div class="modal-footer">
      <button class="btn-sm danger" onclick="Memory.clear()" id="txt-clear-memory">全部清除</button>
      <button class="btn-sm ghost" onclick="UI.closeModal('memory-modal')" id="txt-close">关闭</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div class="modal-overlay" id="help-modal">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title" id="txt-help-title">帮助中心</span>
      <button class="icon-btn" onclick="UI.closeModal('help-modal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="help-body"></div>
    <div class="modal-footer">
      <button class="btn-sm ghost" onclick="UI.closeModal('help-modal')" id="txt-help-close">关闭</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="model-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-hd">
      <span class="modal-title" id="txt-model-picker-title">选择模型</span>
      <button class="icon-btn" onclick="UI.closeModal('model-modal')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="model-body"></div>
  </div>
</div>

<!-- ── JavaScript (load order matters) ───────────────── -->
<script src="js/config.js"></script>
